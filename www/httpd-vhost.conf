<VirtualHost *:80>
    ServerName localhost

    <Directory /var/www/public_html>
        AllowOverride All
        Require all granted

        # Turn on the rewrite engine
        Options +FollowSymlinks
        RewriteEngine on

        # Request routing
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^.*$ index.php [nc,qsa]
    </Directory>
</VirtualHost>
